stages:
  - build
  - test
  - push

variables:
  IMAGE_NAME: "$DOCKERHUB_USERNAME/flask-app"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  DOCKER_TLS_CERTDIR: "/certs"

.docker:
  image: docker:27
  services:
    - docker:27-dind

build_image:
  extends: .docker
  stage: build
  script:
    - echo "Construction de l'image Docker..."
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
    - docker images $IMAGE_NAME
    - docker save -o image.tar $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

test_image:
  extends: .docker
  stage: test
  needs: ["build_image"]
  script:
    - docker load -i image.tar
    - docker run --rm $IMAGE_NAME:$IMAGE_TAG python -c "import app; print('Import OK')"

push_image:
  extends: .docker
  stage: push
  needs: ["build_image", "test_image"]
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - echo "Chargement de l'image..."
    - docker load -i image.tar
    - echo "Poussée de l'image vers Docker Hub..."
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    